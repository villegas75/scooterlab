<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScootLab · Trucos de patinete</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{--bg:#000;--card:#000;--tx:#fff;--mut:#a8a8a8;--ac:#fff;--ac2:#fff;--bd:#3a3a3a;--chip:#1a1a1a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:720px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:28px;margin:8px 0 2px;letter-spacing:-.5px}
h1 b{color:var(--ac)}
.sub{color:var(--mut);margin:0 0 14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--bg);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;padding:6px 2px;border:0;background:transparent;color:var(--mut);border-radius:12px;font-weight:600}
.tab span{display:block;font-size:20px}
.tab.on{background:#fff;color:#000;border-color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{white-space:nowrap;padding:6px 12px;border-radius:99px;border:0;background:var(--chip);color:var(--tx);font-size:14px}
.chip.on{background:var(--tx);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.t{font-weight:700;font-size:18px;margin:0}
.lvl{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;color:#000}
.l1{background:#fff}.l2{background:#c4c4c4}.l3{background:#888}
.d{color:var(--mut);margin:4px 0 0;font-size:15px}
.det{display:none;margin-top:12px;border-top:1px solid var(--bd);padding-top:10px}
.card.open .det{display:block}
ol{padding-left:20px;margin:6px 0}
li{margin-bottom:6px}
.tip{background:var(--chip);border-radius:10px;padding:8px 10px;font-size:14px;margin-top:8px}
button.pri{background:#fff;color:#000;border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px}
button.sec{background:var(--chip);color:var(--tx);border:0;border-radius:10px;padding:8px 12px;font-size:14px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;margin-bottom:8px}
video{width:100%;border-radius:12px;background:#000;max-height:60vh}
.m{color:var(--mut);font-size:13px}.m a{color:inherit}
.tab{font-size:11px!important;line-height:1.3}
.rl{height:calc(100dvh - 250px);min-height:300px;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:16px}
.rv{height:100%;scroll-snap-align:start;position:relative;background:#000;border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.rv video{width:100%;height:100%;object-fit:cover;max-height:none;border-radius:0}
.ro{position:absolute;left:0;right:0;bottom:0;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff}
.vw{position:relative}
.xl{position:fixed!important;inset:0!important;z-index:100;width:100vw!important;height:100dvh!important;max-height:none!important;border-radius:0!important;margin:0!important;border:0!important;background:#000;aspect-ratio:auto!important}
.xl video{width:100%;height:100%;max-height:none!important;object-fit:contain;border-radius:0}
.xl .fsb{top:calc(10px + env(safe-area-inset-top,0px))}
.fsb{position:absolute;top:10px;right:10px;z-index:2;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:10px;padding:6px 10px;font-size:16px}
.an:fullscreen{aspect-ratio:auto;width:100vw;height:100vh;border:0;border-radius:0}
.an:-webkit-full-screen{aspect-ratio:auto;width:100vw;height:100vh;border:0;border-radius:0}
.rv:fullscreen video{object-fit:contain}
.av{overflow:hidden;width:44px;height:44px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-weight:800;flex:none}
.sh{font-size:17px;margin:18px 0 8px;display:flex;justify-content:space-between}.sh span{color:var(--mut);font-size:14px;font-weight:400}
.an{overflow:hidden;display:block;width:100%;aspect-ratio:2/1;background:#0d0d0d;border:1px solid var(--bd);border-radius:12px}
.msg{padding:10px;border-radius:10px;background:var(--chip);font-size:14px;margin-bottom:10px}
.hide{display:none}
</style>
</head>
<body>
<div class="w">
  <h1><a href="/" style="color:inherit;text-decoration:none">Scoot<b>Lab</b></a></h1>
  <p class="sub">Aprende trucos de patinete paso a paso y comparte tus clips.</p>
  <div class="tabs">
    <button class="tab on" id="t1"><span>📚</span>Tutoriales</button>
    <button class="tab" id="t4"><span>🎬</span>Reels</button>
    <button class="tab" id="t2"><span>👥</span>Comunidad</button>
    <button class="tab" id="t3"><span>👤</span>Perfil</button>
  </div>

  <section id="v1">
    <input id="srch" placeholder="Buscar truco…">
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </section>

  <section id="v2" class="hide">
    <div class="card" id="up">
      <p class="t">Sube tu clip</p>
      <p class="m" style="margin:2px 0 10px">Máx. 20 MB. Vídeo corto, mejor en horizontal.</p>
      <select id="sel"></select>
      <input id="ttl" placeholder="Título o comentario (opcional)" maxlength="80">
      <input id="file" type="file" accept="video/*">
      <button class="pri" id="btn">Subir vídeo</button>
      <div class="m" id="st" style="margin-top:8px"></div>
    </div>
    <div class="msg hide" id="noup">Subir vídeos no está disponible para tu cuenta en esta página, pero puedes ver los clips de otros.</div>
    <div class="chips" id="fchips"></div>
    <div id="clips"></div>
  </section>

  <section id="v3" class="hide">
    <input id="psr" placeholder="🔍 Buscar personas por apodo…" maxlength="24">
    <div id="psres"></div>
    <div class="card" id="pf"></div>
    <div id="mine" style="margin-top:12px"></div>
  </section>

  <section id="v4" class="hide"><div id="reels"></div></section>
<p class="m" style="text-align:center;margin-top:24px"><a href="/tutoriales">Tutoriales</a> · <a href="/privacidad">Privacidad</a> · <a href="/terminos">Términos</a> · <a href="/contacto">Contacto</a></p>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supabase-shim.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=[
["bunny","Bunny hop","Básicos",1,"Salta con el patinete pegado a los pies.",["Pies sobre la tabla, agáchate y carga el peso atrás.","Salta y tira de la barra hacia ti.","Estira las piernas en el aire y aterriza flexionando."],"Practica saltando una línea en el suelo.","bunny"],
["curb","Salto de bordillo","Básicos",1,"Sube un bordillo sin bajarte.",["Acércate recto y a velocidad suave.","Haz un bunny hop justo antes del bordillo.","Aterriza con las dos ruedas a la vez."],"Empieza con bordillos bajos.","bunny"],
["hopover","Salto sobre obstáculo","Básicos",2,"Salta un objeto sin tocarlo.",["Coge velocidad moderada y mira el obstáculo.","Despega con bunny hop a un metro de distancia.","Recoge las piernas y aterriza lejos."],"Usa primero un objeto blando.","bunny"],
["manual","Manual","Equilibrio y suelo",1,"Rueda solo con la rueda trasera.",["Rueda suave con rodillas flexionadas.","Echa el peso atrás y tira de la barra.","Busca el punto de equilibrio con el pie trasero."],"Deja el pie junto al freno por seguridad.","manual"],
["manual-largo","Manual largo","Equilibrio y suelo",2,"Mantén el manual varios segundos.",["Sube a manual con poca velocidad.","Controla el equilibrio con brazo y freno.","Baja despacio adelantando el peso."],"Mide metros: cada intento, un poco más.","manual"],
["nose","Nose manual","Equilibrio y suelo",2,"Rueda solo con la rueda delantera.",["Rueda suave con el peso adelantado.","Empuja la barra hacia abajo y adelante.","Mantén el equilibrio con la cadera atrás."],"Practica con rampa suave primero.","nose"],
["fakie","Fakie","Equilibrio y suelo",1,"Rueda hacia atrás con control.",["Para casi en una pendiente suave.","Mira por encima del hombro.","Deja rodar sin frenar y dirige con la barra."],"Busca una zona sin gente.","fakie"],
["fakie-manual","Fakie manual","Equilibrio y suelo",3,"Manual yendo hacia atrás.",["Rueda en fakie estable.","Levanta la rueda delantera tirando de la barra.","Mantén el equilibrio mirando atrás."],"Domina antes manual y fakie por separado.","fakie"],
["decade","Decade","Giros",3,"El cuerpo gira alrededor del patinete agarrado a la barra.",["Haz un bunny hop alto y sujeta bien la barra.","Suelta los pies de la tabla y gira el cuerpo alrededor de la barra.","Vuelve a colocar los pies y aterriza."],"Practica el giro del cuerpo sin saltar, apoyado en la barra.","decade"],
["180","180","Giros",2,"Gira media vuelta en el aire.",["Bunny hop estable.","Gira hombros y cadera hacia un lado.","Aterriza fakie con rodillas flexionadas."],"Mira hacia donde vas a aterrizar.","yaw180"],
["360","360","Giros",3,"Gira una vuelta completa.",["Bunny hop alto.","Gira cabeza y hombros primero, el cuerpo sigue.","Aterriza recto y absorbe con las piernas."],"Practica 180 limpios antes.","yaw360"],
["540","540","Giros",3,"Vuelta y media en el aire.",["Salto máximo, hombros cargados.","Gira con fuerza y mantén el patinete pegado.","Busca el suelo y aterriza fakie."],"Casco y protecciones siempre.","yaw540"],
["720","720","Giros",3,"Dos vueltas completas.",["Salto muy alto con carga de hombros.","Gira rápido y recoge el patinete.","Abre el cuerpo para frenar el giro."],"Solo con 360 y 540 dominados.","yaw720"],
["barspin","Barspin","Aéreos con la barra",2,"Gira la barra 360° en el aire.",["Bunny hop alto.","Suelta una mano y empuja la barra con la otra.","Recupera el agarre antes de aterrizar."],"Prueba primero sobre hierba.","barspin"],
["dbar","Doble barspin","Aéreos con la barra",3,"Dos giros de barra seguidos.",["Salto alto y con tiempo.","Empuja la barra con fuerza y suéltala.","Agarra de nuevo antes de caer."],"Necesitas un barspin muy limpio.","dbar"],
["x-up","X-up","Aéreos con la barra",2,"Cruza los brazos en el aire.",["Bunny hop alto.","En lo alto, gira la barra y cruza los brazos.","Deshaz el cruce antes de bajar."],"Mira siempre al suelo de aterrizaje.","x-up"],
["turndown","Turndown","Aéreos con la barra",2,"Patea la tabla hacia un lado y gira la barra sin cruzar las manos.",["Haz un bunny hop con altura.","Saca la tabla hacia un lado y gira la barra hacia abajo.","Devuelve tabla y barra a su sitio antes de aterrizar."],"Empieza con un ángulo pequeño.","turndown"],
["nohand","No-hander","Aéreos con la barra",3,"Suelta las dos manos en el aire.",["Salta alto y estable.","Suelta ambas manos manteniendo la barra con las rodillas.","Vuelve a agarrar antes de caer."],"Primero suelta solo una mano.","nohand"],
["tuck","Tuck no-hander","Aéreos con la barra",3,"Aprieta la barra entre las rodillas y abre los brazos.",["Salta lo más alto posible.","Lleva las rodillas hacia delante y aprieta la barra entre ellas.","Abre los brazos, vuelve a agarrar y aterriza."],"Suelta una sola mano al empezar.","tuck"],
["superman","Superman","Aéreos con la barra",3,"Estira las piernas atrás y lleva el patinete delante con las dos manos.",["Salto alto desde rampa o suelo.","Extiende las piernas hacia atrás y empuja el patinete hacia delante.","Recoge las piernas y aterriza flexionando."],"Mejor en rampa con aterrizaje suave.","super"],
["cliffhanger","Cliffhanger","Aéreos con la barra",3,"Salto en el que el patinete queda colgando sobre tus pies.",["Salta alto con bunny hop.","Sube el patinete agarrado a la barra.","Deja que cuelgue sobre los pies y vuelve a la tabla para aterrizar."],"Practica primero en foso o colchoneta.","nofoot"],
["tailwhip","Tailwhip","Aéreos con la tabla",3,"La tabla gira 360° alrededor de la barra.",["Salta alto.","Empuja la tabla con el pie delantero.","Recoloca los pies y aterriza flexionando."],"Practica la patada sin saltar.","tailwhip"],
["dtw","Doble tailwhip","Aéreos con la tabla",3,"La tabla da dos vueltas.",["Salto muy alto.","Patada fuerte con el pie delantero.","Espera la segunda vuelta y aterriza."],"Antes, tailwhip muy consistente.","dtw"],
["nofooter","No-footer","Aéreos con la tabla",3,"Saca los pies de la tabla en el aire.",["Salta alto.","Levanta los pies manteniendo las manos en la barra.","Recoloca los pies en la tabla."],"Practica sobre colchoneta.","nofoot"],
["twbar","Full-whip","Aéreos con la tabla",3,"Tailwhip y barspin a la vez en la misma dirección.",["Salta alto.","Haz el tailwhip y suelta la barra para el barspin al mismo tiempo.","Agarra de nuevo y aterriza."],"Domina ambos por separado.","twbar"],
["tw360","Tailwhip 360","Aéreos con la tabla",3,"Tailwhip mientras giras 360.",["Gira cabeza y hombros.","Patada de tailwhip a mitad de giro.","Aterriza fakie o recto."],"Prueba 360 y tailwhip por separado.","tw360"],
["fflip","Frontflip","Flips",3,"Voltereta hacia delante con el patinete.",["Coge velocidad con rampa o salto grande.","Agarra la barra y rueda hacia delante.","Abre el cuerpo y aterriza."],"Solo con foso de espuma o instructor.","fflip"],
["bflip","Backflip","Flips",3,"Voltereta hacia atrás con el patinete.",["Despega de una rampa con velocidad.","Tira de la barra y recoge las rodillas.","Abre y aterriza con rodillas flexionadas."],"Aprende en foso de espuma.","bflip"],
["bbflip","Barspin backflip","Flips",3,"Backflip con barspin.",["Backflip estable y consistente.","Suelta la barra en medio del giro.","Agarra de nuevo y aterriza."],"Solo para expertos.","bbflip"],
["drop","Drop-in","Parque y rampas",2,"Entra en la rampa desde arriba.",["Rueda trasera en el borde, delantera sobre la rampa.","Inclina el cuerpo hacia delante.","Empuja y deja que la rampa te lleve."],"Casco y protecciones.","drop"],
["pump","Pumping","Parque y rampas",1,"Gana velocidad sin empujar.",["Flexiona al bajar la rampa.","Extiende las piernas al subir.","Repite en cada cambio de pendiente."],"Busca un bowl o transiciones suaves.","drop"],
["air","Air en rampa","Parque y rampas",2,"Sal volando del borde de la rampa.",["Sube con velocidad media.","Salta al llegar al borde.","Controla la altura y baja alineado."],"Empieza con rampas bajas.","bunny"],
["fakie-rampa","Fakie en rampa","Parque y rampas",2,"Baja la rampa hacia atrás.",["Sube la rampa de frente.","Para en el borde con el peso atrás.","Baja rodando en fakie."],"Mira por encima del hombro.","fakie"],
["wallride","Wallride","Parque y rampas",2,"Rueda unos segundos por una pared.",["Acércate en ángulo a la pared.","Salta y apoya las ruedas.","Empuja la pared y vuelve al suelo."],"Elige una pared lisa y limpia.","bunny"],
["flair","Flair","Parque y rampas",3,"Backflip con un giro de 180° al salir de la rampa.",["Sube la rampa con velocidad y salta al borde.","Haz un backflip y añade un giro de 180° durante la rotación.","Aterriza de vuelta en la rampa alineado."],"Domina antes backflip y 180 por separado, con foso de espuma.","flair"],
["fufanu","Fufanu","Parque y rampas",3,"Parada en el borde de la rampa sobre la rueda trasera, mirando hacia fuera.",["Sube la rampa con velocidad media.","Apoya la rueda trasera en el borde (tire tap) mirando hacia fuera.","Baja en fakie con control."],"Empieza con rampas bajas y de borde ancho.","manual"],
["50-50","50-50 grind","Grinds",2,"Desliza el lateral de la tabla con las dos ruedas colgando por un lado.",["Acércate paralelo al borde a velocidad media.","Salta y apoya el lateral de la tabla con las ruedas por fuera.","Salta hacia fuera con el patinete alineado."],"Usa un borde bajo y encerado.","grind"],
["smith","Smith grind","Grinds",3,"Rueda trasera sobre el borde y la delantera colgando fuera.",["Acércate en ángulo al borde.","Salta y apoya la rueda trasera encima.","Mantén la delantera por fuera y sal con un salto."],"Aprende antes el 50-50.","grind"],
["feeble","Feeble grind","Grinds",3,"Rueda delantera sobre el borde y la cola de la tabla deslizando.",["Acércate en ángulo al borde.","Salta y apoya la rueda delantera encima.","Deja deslizar la cola de la tabla y sal con un salto."],"Practica con un borde bajo.","grind"],
["nosegrind","Nose grind","Grinds",3,"Grind solo con el peg delantero.",["Acércate recto al borde.","Salta y apoya el peg delantero.","Sal con un salto hacia delante."],"Mira el borde y mantén el equilibrio.","grind"],
["icegrind","Ice grind","Grinds",3,"Grind sobre el peg trasero.",["Acércate recto al borde.","Salta y apoya el peg trasero.","Sal con un salto."],"Pon el peso ligeramente atrás.","grind"],
["boardslide","Boardslide","Grinds",3,"Desliza por la parte inferior de la tabla mirando de frente.",["Acércate recto al borde o barra.","Salta y apoya la parte inferior de la tabla.","Sal con un salto y aterriza alineado."],"Empieza con un borde bajo y encerado.","grind"]
].map(a=>({id:a[0],n:a[1],c:a[2],l:a[3],d:a[4],s:a[5],t:a[6],m:a[7]}));
const cats=["Todos",...new Set(T.map(x=>x.c))];
let cat="Todos",db=null,assets=null,me=null,clips=[],profs={};
let viewU=null,pTab="clips",feed="all",follows={};
const nm=u=>(profs[u]&&profs[u].name)||"Anónimo";
const q=s=>esc(String(s||"")).replace(/"/g,"&quot;");
const $=i=>document.getElementById(i);
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
const LN=["","Fácil","Medio","Difícil"];

function renderChips(){
  $("chips").innerHTML=cats.map(c=>`<button class="chip ${c===cat?"on":""}" data-c="${c}">${c}</button>`).join("");
  $("chips").onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;renderChips();renderList()}};
}
function renderList(){
  const card=x=>`
  <div class="card" data-id="${x.id}">
    <div class="row"><p class="t">${x.n}</p><span class="lvl l${x.l}">${LN[x.l]}</span></div>
    <p class="d">${x.d}</p>
    <div class="det">
      <div class="an" data-id="${x.id}"></div><div class="m" style="margin:6px 0 8px;min-height:40px">Animación 3D de referencia</div><div style="margin:0 0 8px"><label class="sec" style="display:inline-block;margin-right:6px">📂 Cargar captura .bvh<input type="file" accept=".bvh,.txt" hidden data-bvh="${x.id}"></label><button class="sec" data-bvhoff="${x.id}">Animación base</button><button class="sec" data-fsa="${x.id}" style="margin-left:6px">⛶ Pantalla completa</button></div><ol>${x.s.map(s=>`<li>${s}</li>`).join("")}</ol>
      <div class="tip">💡 ${x.t}</div><div class="tc" data-id="${x.id}" style="margin-top:12px"></div>
      <p style="margin:10px 0 0"><button class="sec" data-up="${x.id}">Subir mi clip de este truco</button></p>
    </div>
  </div>`;
  const qy=($("srch").value||"").toLowerCase().trim();
  $("list").innerHTML=cats.slice(1).filter(c=>cat==="Todos"||c===cat).map(c=>{const L=T.filter(x=>x.c===c&&x.n.toLowerCase().includes(qy));return L.length?'<h2 class="sh">'+c+' <span>'+L.length+'</span></h2>'+L.map(card).join(""):""}).join("")||'<p class="m">No hay trucos con ese nombre.</p>';
}
$("srch").oninput=renderList;
$("list").onclick=e=>{
  const u=e.target.dataset.up;
  if(u){show(2);$("sel").value=u;window.scrollTo(0,0);return}
  const o=e.target.dataset.bvhoff;if(o){mocap[o]=null;return}const fa=e.target.dataset.fsa;if(fa){xl(e.target.closest(".det").querySelector(".an"));return}if(e.target.closest(".det"))return;const c=e.target.closest(".card");if(c){const o=c.classList.contains("open");document.querySelectorAll(".card.open").forEach(x=>x.classList.remove("open"));if(!o)c.classList.add("open")}
};
function show(n){
  [1,2,3,4].forEach(i=>{$("v"+i).classList.toggle("hide",n!==i);$("t"+i).classList.toggle("on",n===i)});
  if(n===3)renderProfile();
  if(n===4)renderReels();
}
$("t1").onclick=()=>show(1);$("t2").onclick=()=>show(2);$("t3").onclick=()=>{viewU=null;pTab="clips";show(3)};$("t4").onclick=()=>show(4);
const LV=["Principiante","Intermedio","Avanzado","Pro"];
const ini=u=>{const p=profs[u]||{};return p.av?'<img src="'+q(p.av)+'" alt="" style="width:100%;height:100%;object-fit:cover">':esc((p.name||"?")[0].toUpperCase())};
const fl=u=>follows[u]||[],fr=u=>Object.keys(follows).filter(k=>fl(k).includes(u));
const cc=u=>clips.filter(c=>c.uid===u).length;
const feedClips=()=>feed==="fol"?clips.filter(c=>fl(me).includes(c.uid)):clips;
async function toggleFollow(u){
  if(!db||!me||u===me)return;
  const cur=fl(me),ids=cur.includes(u)?cur.filter(x=>x!==u):[...cur,u];
  follows[me]=ids;renderProfile();renderClips();
  try{await db.collection("follows").doc(me).set({ids})}catch(e){}
